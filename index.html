<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Roleplay Chat</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: 'Segoe UI', 'Sarabun', sans-serif; background:#0f1117; color:#eaeaf0; height:100vh; overflow:hidden; }
  .app { display:flex; height:100vh; }

  /* Sidebar */
  .sidebar { width:290px; background:#161822; border-right:1px solid #262a38; display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-header { padding:16px; border-bottom:1px solid #262a38; }
  .sidebar-header h1 { font-size:18px; margin-bottom:10px; }
  .sidebar-header button { width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#7c5cff,#5b8cff); color:#fff; font-weight:600; cursor:pointer; }
  .model-select-wrap { padding:12px 16px; border-bottom:1px solid #262a38; }
  .model-select-wrap label { font-size:12px; color:#9aa0b4; display:block; margin-bottom:6px; }
  .model-select-wrap select { width:100%; padding:8px; border-radius:6px; background:#1e2130; color:#eaeaf0; border:1px solid #2e3346; }
  .char-list { flex:1; overflow-y:auto; padding:10px; }
  .char-item { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; cursor:pointer; margin-bottom:6px; transition:.15s; position:relative; }
  .char-item:hover { background:#1e2130; }
  .char-item.active { background:#242850; }
  .char-avatar { font-size:22px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:#2a2e42; border-radius:50%; flex-shrink:0; }
  .char-name { font-size:14px; font-weight:500; flex:1; }
  .char-del { opacity:0; font-size:12px; color:#ff6b6b; background:none; border:none; cursor:pointer; }
  .char-item:hover .char-del { opacity:1; }

  /* Chat area */
  .chat-area { flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-header { padding:16px 20px; border-bottom:1px solid #262a38; display:flex; align-items:center; gap:12px; background:#12141c; }
  .chat-header .char-avatar { width:42px; height:42px; font-size:24px; }
  .chat-header h2 { font-size:16px; }
  .chat-header p { font-size:12px; color:#9aa0b4; max-width:500px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:70%; padding:10px 14px; border-radius:14px; line-height:1.5; font-size:14.5px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,#5b8cff,#7c5cff); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:#1e2130; border:1px solid #2e3346; border-bottom-left-radius:4px; }
  .msg.system-note { align-self:center; color:#ff8080; font-size:12px; background:none; }
  .msg .cursor { display:inline-block; width:6px; height:14px; background:#8a8fbf; margin-left:2px; animation: blink 1s infinite; vertical-align:middle; }
  @keyframes blink { 50% { opacity:0; } }

  .input-bar { padding:14px 20px; border-top:1px solid #262a38; display:flex; gap:10px; align-items:flex-end; background:#12141c; }
  .input-bar textarea { flex:1; resize:none; max-height:120px; padding:10px 14px; border-radius:10px; background:#1e2130; border:1px solid #2e3346; color:#eaeaf0; font-size:14px; font-family:inherit; }
  .input-bar button { padding:10px 18px; border:none; border-radius:10px; cursor:pointer; font-weight:600; }
  #sendBtn { background:linear-gradient(135deg,#7c5cff,#5b8cff); color:#fff; }
  #sendBtn:disabled { opacity:.5; cursor:not-allowed; }
  #clearBtn { background:#262a38; color:#eaeaf0; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:10; }
  .modal-overlay.open { display:flex; }
  .modal { background:#161822; border:1px solid #2e3346; border-radius:14px; padding:24px; width:400px; max-width:90vw; }
  .modal h2 { margin-bottom:16px; font-size:17px; }
  .modal label { font-size:12px; color:#9aa0b4; display:block; margin:10px 0 5px; }
  .modal input, .modal textarea { width:100%; padding:9px 10px; border-radius:8px; background:#1e2130; border:1px solid #2e3346; color:#eaeaf0; font-family:inherit; font-size:13.5px; }
  .modal-actions { display:flex; gap:10px; margin-top:18px; }
  .modal-actions button { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
  #saveCharBtn { background:linear-gradient(135deg,#7c5cff,#5b8cff); color:#fff; }
  #cancelCharBtn { background:#262a38; color:#eaeaf0; }

  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:#2e3346; border-radius:4px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎭 Roleplay AI</h1>
      <button id="newCharBtn">+ สร้างตัวละครใหม่</button>
    </div>
    <div class="model-select-wrap">
      <label>โมเดล AI</label>
      <select id="modelSelect"><option value="">กำลังโหลดรายชื่อโมเดล...</option></select>
    </div>
    <div class="char-list" id="charList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header" id="chatHeader"></div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <textarea id="userInput" placeholder="พิมพ์ข้อความถึงตัวละคร... (Enter เพื่อส่ง, Shift+Enter ขึ้นบรรทัดใหม่)" rows="1"></textarea>
      <button id="sendBtn">ส่ง</button>
      <button id="clearBtn" title="ล้างประวัติแชทนี้">🗑️ ล้าง</button>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>สร้างตัวละครใหม่</h2>
    <label>ชื่อตัวละคร</label>
    <input id="charName" placeholder="เช่น กัปตันแม็กซ์">
    <label>อวาตาร์ (emoji เดียว)</label>
    <input id="charAvatar" maxlength="2" value="🙂">
    <label>บุคลิก / คำสั่งบทบาท (System Prompt)</label>
    <textarea id="charPrompt" rows="6" placeholder="อธิบายว่าตัวละครนี้คือใคร นิสัยเป็นอย่างไร พูดจาแบบไหน มีภูมิหลังอะไร..."></textarea>
    <div class="modal-actions">
      <button id="saveCharBtn">บันทึกตัวละคร</button>
      <button id="cancelCharBtn">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
const PRESETS = [
  { id:'luna', name:'ลูนา นักผจญภัย', avatar:'🗺️',
    prompt:'คุณคือลูนา นักผจญภัยสาวจอมกล้าผู้เดินทางสำรวจดินแดนลึกลับทั่วโลก มีนิสัยร่าเริง ช่างพูด อยากรู้อยากเห็น และรักอิสระ พูดคุยด้วยน้ำเสียงกระตือรือร้น ชอบเล่าเรื่องราวการผจญภัยและให้กำลังใจผู้อื่นเสมอ' },
  { id:'kane', name:'นักสืบเคน', avatar:'🕵️',
    prompt:'คุณคือนักสืบเคน นักสืบเอกชนสไตล์ฟิล์มนัวร์ พูดจากระชับ เย้ยหยัน มองโลกในแง่ร้ายเล็กน้อยแต่มีจรรยาบรรณสูง ชอบวิเคราะห์รายละเอียดเล็กๆ น้อยๆ และเปรียบเทียบสถานการณ์กับคดีเก่าๆ ที่เคยเจอ' },
  { id:'aria', name:'อาเรีย เพื่อนใจดี', avatar:'💫',
    prompt:'คุณคืออาเรีย เพื่อนคู่ใจที่อบอุ่น ใจดี รับฟังทุกเรื่องด้วยความเข้าใจ ให้กำลังใจ และคอยเป็นห่วงเป็นใยผู้ใช้เสมือนเพื่อนสนิท พูดจาสุภาพอ่อนโยน' },
  { id:'sensei', name:'อาจารย์วัตต์', avatar:'🧘',
    prompt:'คุณคืออาจารย์วัตต์ ปรมาจารย์ผู้สงบนิ่งและมีปัญญาลึกซึ้ง พูดจาช้าๆ ให้ข้อคิดผ่านคำอุปมาและปรัชญาชีวิต มักถามคำถามกลับเพื่อให้ผู้สนทนาได้คิดทบทวนด้วยตนเอง' },
  { id:'nova', name:'โนวา หุ่นยนต์กวนๆ', avatar:'🤖',
    prompt:'คุณคือโนวา หุ่นยนต์จากอนาคตที่มีอารมณ์ขันแบบแดดแห้ง (deadpan) ชอบพูดจาแดกดันแบบมิตรภาพ เสียดสีเบาๆ แต่จริงๆ แล้วแคร์ผู้ใช้มาก มักพูดถึงตัวเองว่าเป็นหุ่นยนต์ที่ "ถูกโปรแกรมมาไม่ดีพอ" สำหรับมารยาท' }
];

const ROLEPLAY_RULES = `

กฎการเล่นบทบาท (สำคัญมาก):
- ตอบในบทบาทนี้เสมอ ห้ามบอกว่าตัวเองเป็น AI หรือหลุดคาแรกเตอร์ไม่ว่ากรณีใด
- ใช้น้ำเสียงและสำนวนที่สอดคล้องกับบุคลิกตัวละครตลอดบทสนทนา
- สามารถใช้เครื่องหมาย * ล้อมข้อความ เพื่อบรรยายท่าทางหรือฉาก เช่น *ยิ้มเล็กน้อย*
- ตอบให้เป็นธรรมชาติ กระชับพอเหมาะ เหมือนบทสนทนาจริง ไม่ต้องยาวเกินไป`;

let customCharacters = JSON.parse(localStorage.getItem('rp_custom_characters') || '[]');
let currentCharId = localStorage.getItem('rp_current_char') || PRESETS[0].id;
let currentModel = localStorage.getItem('rp_current_model') || '';
let isSending = false;

const els = {
  charList: document.getElementById('charList'),
  chatHeader: document.getElementById('chatHeader'),
  messages: document.getElementById('messages'),
  userInput: document.getElementById('userInput'),
  sendBtn: document.getElementById('sendBtn'),
  clearBtn: document.getElementById('clearBtn'),
  modelSelect: document.getElementById('modelSelect'),
  newCharBtn: document.getElementById('newCharBtn'),
  modalOverlay: document.getElementById('modalOverlay'),
  charName: document.getElementById('charName'),
  charAvatar: document.getElementById('charAvatar'),
  charPrompt: document.getElementById('charPrompt'),
  saveCharBtn: document.getElementById('saveCharBtn'),
  cancelCharBtn: document.getElementById('cancelCharBtn'),
};

function getAllCharacters(){ return [...PRESETS, ...customCharacters]; }
function getCharacter(id){ return getAllCharacters().find(c => c.id === id); }
function historyKey(id){ return 'rp_history_' + id; }
function getHistory(id){ return JSON.parse(localStorage.getItem(historyKey(id)) || '[]'); }
function saveHistory(id, history){ localStorage.setItem(historyKey(id), JSON.stringify(history)); }

function renderCharList(){
  els.charList.innerHTML = '';
  getAllCharacters().forEach(c => {
    const isCustom = customCharacters.some(x => x.id === c.id);
    const item = document.createElement('div');
    item.className = 'char-item' + (c.id === currentCharId ? ' active' : '');
    item.innerHTML = `<div class="char-avatar">${c.avatar}</div><div class="char-name">${escapeHtml(c.name)}</div>` +
      (isCustom ? `<button class="char-del" data-id="${c.id}">✕</button>` : '');
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('char-del')) return;
      selectCharacter(c.id);
    });
    els.charList.appendChild(item);
  });
  els.charList.querySelectorAll('.char-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      if (confirm('ลบตัวละครนี้และประวัติแชททั้งหมด?')) {
        customCharacters = customCharacters.filter(c => c.id !== id);
        localStorage.setItem('rp_custom_characters', JSON.stringify(customCharacters));
        localStorage.removeItem(historyKey(id));
        if (currentCharId === id) currentCharId = PRESETS[0].id;
        renderCharList();
        renderChat();
      }
    });
  });
}

function renderChat(){
  const c = getCharacter(currentCharId);
  els.chatHeader.innerHTML = `<div class="char-avatar">${c.avatar}</div>
    <div><h2>${escapeHtml(c.name)}</h2><p>${escapeHtml(c.prompt)}</p></div>`;
  els.messages.innerHTML = '';
  const history = getHistory(currentCharId);
  history.forEach(m => appendMessageEl(m.role, m.content));
  scrollToBottom();
}

function appendMessageEl(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : role === 'system-note' ? 'system-note' : 'assistant');
  div.textContent = text;
  els.messages.appendChild(div);
  return div;
}

function scrollToBottom(){ els.messages.scrollTop = els.messages.scrollHeight; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function selectCharacter(id){
  currentCharId = id;
  localStorage.setItem('rp_current_char', id);
  renderCharList();
  renderChat();
}

async function loadModels(){
  const fallback = ['gpt-5.6-luna','claude-sonnet-4-6','gemini-3.1-flash-lite','gpt-5.4-nano'];
  try {
    const models = await puter.ai.listModels();
    els.modelSelect.innerHTML = '<option value="">อัตโนมัติ (ค่าเริ่มต้น)</option>';
    const byProvider = {};
    models.forEach(m => {
      byProvider[m.provider] = byProvider[m.provider] || [];
      byProvider[m.provider].push(m);
    });
    Object.keys(byProvider).sort().forEach(provider => {
      const group = document.createElement('optgroup');
      group.label = provider;
      byProvider[provider].forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name || m.id;
        group.appendChild(opt);
      });
      els.modelSelect.appendChild(group);
    });
    if (currentModel) els.modelSelect.value = currentModel;
  } catch (err) {
    els.modelSelect.innerHTML = '<option value="">อัตโนมัติ (ค่าเริ่มต้น)</option>';
    fallback.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      els.modelSelect.appendChild(opt);
    });
  }
}

els.modelSelect.addEventListener('change', () => {
  currentModel = els.modelSelect.value;
  localStorage.setItem('rp_current_model', currentModel);
});

async function sendMessage(){
  const text = els.userInput.value.trim();
  if (!text || isSending) return;
  isSending = true;
  els.sendBtn.disabled = true;
  els.userInput.value = '';
  els.userInput.style.height = 'auto';

  const character = getCharacter(currentCharId);
  let history = getHistory(currentCharId);

  appendMessageEl('user', text);
  history.push({ role:'user', content:text });
  scrollToBottom();

  const assistantDiv = appendMessageEl('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  assistantDiv.appendChild(cursor);
  scrollToBottom();

  const messages = [
    { role:'system', content: character.prompt + ROLEPLAY_RULES },
    ...history
  ];

  try {
    const options = { stream: true };
    if (currentModel) options.model = currentModel;
    const response = await puter.ai.chat(messages, options);
    let fullText = '';
    for await (const part of response) {
      if (part?.text) {
        fullText += part.text;
        assistantDiv.textContent = fullText;
        assistantDiv.appendChild(cursor);
        scrollToBottom();
      }
    }
    cursor.remove();
    if (!fullText) fullText = '(ไม่มีข้อความตอบกลับ)';
    assistantDiv.textContent = fullText;
    history.push({ role:'assistant', content: fullText });
    saveHistory(currentCharId, history);
  } catch (err) {
    cursor.remove();
    assistantDiv.remove();
    appendMessageEl('system-note', 'เกิดข้อผิดพลาด: ' + (err?.message || err));
    saveHistory(currentCharId, history);
  } finally {
    isSending = false;
    els.sendBtn.disabled = false;
    els.userInput.focus();
  }
}

els.sendBtn.addEventListener('click', sendMessage);
els.userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
els.userInput.addEventListener('input', () => {
  els.userInput.style.height = 'auto';
  els.userInput.style.height = Math.min(els.userInput.scrollHeight, 120) + 'px';
});

els.clearBtn.addEventListener('click', () => {
  if (confirm('ล้างประวัติแชทของตัวละครนี้ทั้งหมด?')) {
    saveHistory(currentCharId, []);
    renderChat();
  }
});

// Character creation modal
els.newCharBtn.addEventListener('click', () => {
  els.charName.value = '';
  els.charAvatar.value = '🙂';
  els.charPrompt.value = '';
  els.modalOverlay.classList.add('open');
});
els.cancelCharBtn.addEventListener('click', () => els.modalOverlay.classList.remove('open'));
els.modalOverlay.addEventListener('click', (e) => { if (e.target === els.modalOverlay) els.modalOverlay.classList.remove('open'); });

els.saveCharBtn.addEventListener('click', () => {
  const name = els.charName.value.trim();
  const avatar = els.charAvatar.value.trim() || '🙂';
  const prompt = els.charPrompt.value.trim();
  if (!name || !prompt) {
    alert('กรุณากรอกชื่อและบุคลิกตัวละคร');
    return;
  }
  const id = 'custom_' + Date.now();
  customCharacters.push({ id, name, avatar, prompt });
  localStorage.setItem('rp_custom_characters', JSON.stringify(customCharacters));
  els.modalOverlay.classList.remove('open');
  selectCharacter(id);
});

// Init
loadModels();
renderCharList();
renderChat();
</script>
</body>
</html>
