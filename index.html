<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Studio - Wizarding & Detective Roleplay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(99, 102, 241, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-accent: #6366f1;
            --secondary-accent: #a855f7;
            --user-msg-bg: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --ai-msg-bg: rgba(51, 65, 85, 0.8);
            --sidebar-bg: rgba(15, 23, 42, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }

        .container { width: 100%; max-width: 1100px; height: 85vh; background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); display: flex; flex-direction: row; overflow: hidden; }

        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--secondary-accent); display: flex; align-items: center; gap: 10px; }
        .role-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .role-list::-webkit-scrollbar { width: 4px; height: 4px; }
        .role-list::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }

        .role-item { padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; display: flex; align-items: center; gap: 12px; font-size: 14px; background: rgba(255,255,255,0.02); }
        .role-item:hover { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); }
        .role-item.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%); border-color: var(--secondary-accent); color: white; font-weight: bold; }
        .role-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-accent); display: flex; justify-content: center; align-items: center; font-size: 14px; color: white; flex-shrink: 0; }

        .role-item:nth-child(2) .role-icon { background: #15803d; }
        .role-item:nth-child(3) .role-icon { background: #ca8a04; }
        .role-item:nth-child(4) .role-icon { background: #1d4ed8; }
        .role-item:nth-child(5) .role-icon { background: #64748b; }

        .chat-main { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: calc(100% - 280px); min-height: 0; }

        .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.2); justify-content: space-between; flex-shrink: 0; }
        .chat-header i.fa-microchip { font-size: 24px; color: var(--secondary-accent); }
        .chat-header h2 { font-size: 20px; font-weight: 600; background: linear-gradient(to right, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        #model-select { background: rgba(15, 23, 42, 0.8); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none; cursor: pointer; transition: 0.3s; max-width: 200px; }
        #model-select:focus { border-color: var(--primary-accent); }
        #model-select option { background: #0f172a; color: white; }

        #session-badge { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 8px; white-space: nowrap; }

        #clear-chat-btn, #settings-btn { width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0; }
        #clear-chat-btn { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        #clear-chat-btn:hover { background: rgba(239, 68, 68, 0.4); transform: scale(1.05); color: white; }
        #settings-btn { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
        #settings-btn:hover { background: rgba(99, 102, 241, 0.4); transform: scale(1.05); color: white; }

        .role-section { padding: 12px 24px; background: rgba(15, 23, 42, 0.1); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .role-section label { display: block; font-size: 11px; text-transform: uppercase; color: var(--secondary-accent); margin-bottom: 6px; font-weight: bold; }
        .role-input-wrapper { position: relative; display: flex; align-items: center; }
        .role-input-wrapper i { position: absolute; left: 12px; top: 12px; color: var(--text-muted); font-size: 14px; }

        #system-role { width: 100%; padding: 10px 12px 10px 38px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 13px; outline: none; transition: 0.3s; resize: none; height: 40px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        #system-role:focus { border-color: var(--secondary-accent); height: 100px; white-space: normal; overflow-y: auto; }

        #chat-window { flex-grow: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }

        .msg-row { display: flex; width: 100%; }
        .msg-row.user-row { justify-content: flex-end; }
        .msg-row.ai-row { justify-content: flex-start; }
        .msg-bubble { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
        .user-row .msg-bubble { background: var(--user-msg-bg); color: #fff; border-bottom-right-radius: 4px; }
        .ai-row .msg-bubble { background: var(--ai-msg-bg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

        .input-section { padding: 16px 24px; background: rgba(15, 23, 42, 0.4); border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .input-wrapper { display: flex; gap: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 6px 6px 6px 16px; border-radius: 16px; align-items: center; transition: 0.3s;}
        .input-wrapper:focus-within { border-color: var(--primary-accent); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        #user-input { flex-grow: 1; background: transparent; border: none; color: var(--text-main); font-size: 14px; padding: 8px 0; outline: none; }
        #send-btn { background: var(--primary-accent); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0; }
        #send-btn:hover { background: #4f46e5; transform: scale(1.05); }
        #send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* หน้าต่างตั้งค่า API */
        #settings-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.7); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 10; }
        #settings-modal.open { display: flex; }
        .modal-box { width: 100%; max-width: 420px; background: #1e293b; border: 1px solid var(--border-color); border-radius: 20px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
        .modal-box h3 { font-size: 16px; margin-bottom: 14px; color: var(--secondary-accent); }
        .modal-box label { display: block; font-size: 11px; color: var(--text-muted); margin: 10px 0 4px; font-weight: bold; }
        .modal-box input { width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 13px; outline: none; }
        .modal-box input:focus { border-color: var(--secondary-accent); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .modal-actions button { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); cursor: pointer; }
        .modal-actions button.ok { background: var(--primary-accent); border-color: var(--primary-accent); }

        @media screen and (max-width: 768px) {
            body { padding: 0; }
            .container { flex-direction: column; height: 100vh; border-radius: 0; border: none; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.8); }
            .sidebar-header { padding: 10px 15px; font-size: 14px; }
            .role-list { flex-direction: row; overflow-x: auto; padding: 5px 15px 15px 15px; gap: 10px; }
            .role-item { flex-shrink: 0; padding: 8px 12px; }
            .chat-main { width: 100%; }
            .chat-header { padding: 12px 15px; }
            .chat-header h2 { display: none; }
            #model-select { font-size: 12px; padding: 4px 6px; max-width: 140px; }
            #session-badge { display: none; }
            .role-section { padding: 10px 15px; }
            #chat-window { padding: 15px; }
            .msg-bubble { max-width: 90%; }
            .input-section { padding: 12px 15px; }
            #send-btn { width: 36px; height: 36px; }
            .role-icon { width: 24px; height: 24px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-masks-theater"></i> เลือกตัวละคร (Roleplay)
            </div>
            <div class="role-list">
                <div class="role-item active" onclick="selectRole('custom', this)">
                    <div class="role-icon"><i class="fa-solid fa-user-astronaut"></i></div>
                    <span>บทบาทอิสระ (Custom)</span>
                </div>
                <div class="role-item" onclick="selectRole('draco', this)">
                    <div class="role-icon"><i class="fa-solid fa-snake"></i></div>
                    <span>เดรโก มัลฟอย</span>
                </div>
                <div class="role-item" onclick="selectRole('cedric', this)">
                    <div class="role-icon"><i class="fa-solid fa-badger-honey"></i></div>
                    <span>เซดริก ดิกกอรี่</span>
                </div>
                <div class="role-item" onclick="selectRole('pak', this)">
                    <div class="role-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    <span>รองฯ ภาคย์ (กองปราบ)</span>
                </div>
                <div class="role-item" onclick="selectRole('hibari', this)">
                    <div class="role-icon"><i class="fa-solid fa-cloud"></i></div>
                    <span>ฮิบาริ เคียวยะ</span>
                </div>
            </div>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                    <i class="fa-solid fa-microchip" style="font-size: 20px;"></i>
                    <h2>AI Studio</h2>
                </div>
                <div class="header-actions">
                    <select id="model-select"></select>
                    <div id="session-badge"></div>
                    <button id="settings-btn" onclick="openSettings()" title="ตั้งค่า API (OpenRouter)">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button id="clear-chat-btn" onclick="clearChat()" title="ล้างประวัติการแชท (New Chat)">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <div class="role-section">
                <label>AI Role Prompt (แก้ไขได้)</label>
                <div class="role-input-wrapper">
                    <i class="fa-solid fa-user-gear"></i>
                    <textarea id="system-role" placeholder="ระบุบทบาทของ AI ที่นี่ (ไม่บังคับ)..."></textarea>
                </div>
            </div>

            <div id="chat-window"></div>

            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="พิมพ์ข้อความที่นี่..." autocomplete="off">
                    <button id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target===this)closeSettings()">
        <div class="modal-box">
            <h3><i class="fa-solid fa-gear"></i> ตั้งค่า API (OpenRouter)</h3>
            <label>BASE URL</label>
            <input id="cfg-base" placeholder="https://openrouter.ai/api/v1">
            <label>API KEY</label>
            <input id="cfg-key" type="password" autocomplete="off" placeholder="sk-or-v1-...">
            <div class="modal-actions">
                <button onclick="closeSettings()">ยกเลิก</button>
                <button class="ok" onclick="saveSettings()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const presetRoles = {
            custom: "",
            draco: `ชื่อ [เดรโก มัลฟอย] บุคลิก [หยิ่งยโส ภาคภูมิในสายเลือดบริสุทธิ์และตระกูลมัลฟอย เจ้าเล่ห์ ปากร้าย ชอบเยาะเย้ยและกลั่นแกล้งคนที่ด้อยกว่า เป็นเด็กโปรดของศาสตราจารย์สเนป หัวหน้าแก๊งในสลิธีริน มีแครบบ์กับโกยล์เป็นลูกสมุน เกลียดแฮร์รี่ พอตเตอร์เข้ากระดูกดำ ขี้ขลาดเมื่อเผชิญสถานการณ์จริง ชอบฟ้องพ่อ ลูซิอัส มัลฟอย ลึกๆ มีความไม่มั่นคงและถูกกดดันจากความคาดหวังของครอบครัว เก่งควิดดิชในตำแหน่งซีกเกอร์ของทีมสลิธีริน] เรื่องราวพื้นหลัง [เกิดวันที่ 5 มิถุนายน ค.ศ. 1980 ที่คฤหาสน์มัลฟอยในวิลต์เชียร์ ลูกชายคนเดียวของลูซิอัสและนาร์ซิสซา ตระกูลมัลฟอยเป็นหนึ่งในยี่สิบแปดสายเลือดบริสุทธิ์ มั่งคั่งและมีอิทธิพลในกระทรวงเวทมนตร์ ถูกปลูกฝังเรื่องความเหนือกว่าของเลือดบริสุทธิ์ตั้งแต่เด็ก ถูกแม่ตามใจทุกอย่าง เข้าสลิธีรินตามรอยบรรพบุรุษ มีศาสตราจารย์สเนปเป็นพ่อทูนหัว ความเกลียดชังแฮร์รี่เริ่มจากที่แฮร์รี่ปฏิเสธมือของเขาบนรถไฟฮอกวอตส์เอ็กซ์เพรส เมื่อพูดถึงเรื่องอื่นๆ เขาจะอ้างถึงพ่อและบ้านสลิธีรินเสมอ]`,
            cedric: `ชื่อ [เซดริก ดิกกอรี่] บุคลิก [สุภาพ อ่อนน้อม เปี่ยมน้ำใจอย่างแท้จริง เป็นแบบอย่างของชาวฮัฟเฟิลพัฟ ขยัน ซื่อสัตย์ ยุติธรรม เล่นอย่างแฟร์เสมอ มีเสน่ห์เงียบๆ แบบสุภาพบุรุษ ยิ้มอ่อนโยน พูดจาช้าๆ ชัดถ้อยชัดคำ ไม่โอ้อวดแม้จะเก่งทั้งเรียนและควิดดิช เป็นกัปตันทีมและพรีเฟกต์ กล้าหาญเมื่อจำเป็นและพร้อมช่วยคนอื่นโดยไม่หวังผลตอบแทน] เรื่องราวพื้นหลัง [เกิดในปี ค.ศ. 1977 ในครอบครัวพ่อมดสายเลือดบริสุทธิ์ใกล้หมู่บ้านอ็อตเตอรี่ เซนต์แคชโพล พ่อคือเอมอส ดิกกอรี่ เจ้าหน้าที่แผนกควบคุมและดูแลสัตว์วิเศษ ผู้ภูมิใจในตัวลูกอย่างออกนอกหน้า แม่เป็นหญิงเงียบขรึมสุภาพ ถูกหมวกคัดสรรจัดเข้าฮัฟเฟิลพัฟแทบไม่ลังเล เรียนเก่งโดยเฉพาะวิชาการแปลงร่างและป้องกันตัว เป็นซีกเกอร์ทีมฮัฟเฟิลพัฟที่ปราดเปรียวและเล่นอย่างแฟร์ ไม่เคยเล่นสกปรก เมื่อพูดคุยเขาจะแสดงความอ่อนโยนและช่วยเหลืออย่างจริงใจ]`,
            pak: `ชื่อ [ภาคย์] บทบาท [รองผู้กำกับกองปราบฯ ผู้เย็นชาที่ต้องปกป้องพยานปากเอกอย่างคุณจากอิทธิพลมืด ในโลกที่กฎหมายอาจไม่เพียงพอ] บุคลิก [จริงจัง ฉลาด เย็นชา ดุ สุภาพ] เรื่องราวพื้นหลัง [โตในบ้านพักข้าราชการตุลาการที่เชียงราย พ่อคือผู้พิพากษาประดิษฐ์ผู้ยึดมั่นในความยุติธรรม ตอนภาคย์อายุ 17 พ่อถูกลอบยิงเสียชีวิตหลังตัดสินคดีค้ายาข้ามชาติของเครือข่าย "พยัคฆ์ทมิฬ" และคดีถูกเป่าให้เงียบหาย แม่ตรอมใจเสียชีวิตตามไปอีก 3 ปีต่อมา เขาเลิกศรัทธาระบบ "ตาชั่ง" และเลือกเป็น "ดาบ" เข้าเรียน นรต. จบอันดับหนึ่ง ได้ฉายา "เครื่องจักรนิติธรรม" เป็นรองผู้กำกับกองปราบตอนอายุ 32 ปี ไม่รับสินบน ไม่ประนีประนอม อยู่คอนโดมินิมอลไม่มีรูปครอบครัว ไม่เคยมีคนรัก เพราะไม่อยากให้ใครเป็นจุดอ่อน ตอนนี้ได้รับมอบหมายดูแล "คุณ" พยานปากเอกคดีสังหารลับในเครือข่ายนักการเมืองท้องถิ่น ซึ่งเป็นโอกาสสุดท้ายที่จะทลายอิทธิพลที่ฆ่าพ่อ ช่วงแรกเขาเข้มงวด ดุ และรักษาระยะห่าง แต่ค่อยๆ แสดงความอ่อนโยนผ่านการกระทำ เช่น จำอาหารที่คุณชอบ เอาหนังสือมาให้อ่าน แม้คำพูดจะยังห้วน เขาพาคุณย้ายเซฟเฮาส์ทุก 48 ชั่วโมงและเผชิญแรงกดดันจากเบื้องบนให้ปิดคดี] ตัวละครสนับสนุน [ดาบยุทธ: ตำรวจชั้นผู้น้อยมือขวาของภาคย์ ใจดี อารมณ์ดี ซื่อสัตย์ เป็นคนเดียวที่กล้าแหย่ภาคย์เรื่องเครียดเกินไป]`,
            hibari: `ชื่อ [ฮิบาริ เคียวยะ] บทบาท [หัวหน้าคณะกรรมการคุมกฎผู้ปกครองนามิโมริด้วยความกลัว เมฆาผู้ล่องลอยไม่ยึดติดกับใคร แต่พร้อมจะขย้ำศัตรูที่มาขวางทาง] บุคลิก [เย็นชา เผด็จการ รักสันโดษอย่างรุนแรง เกลียดการรวมกลุ่มของ "สัตว์กินพืช" ใช้คำขู่ "จะขย้ำให้ตาย" กับคนที่ทำผิดกฎหรือสร้างความวุ่นวายในนามิโมริ รับผิดชอบต่อหน้าที่สูงและภูมิใจในโรงเรียนอย่างที่สุด แม้ดูโหดแต่มีมุมอ่อนโยนต่อสัตว์ตัวเล็กและเด็กๆ โดยเฉพาะนก "ฮิเบิร์ด"] เรื่องราวพื้นหลัง [เติบโตท่ามกลางความโดดเดี่ยวในเมืองนามิโมริ มองความเหงาเป็นความแข็งแกร่ง ก่อตั้งคณะกรรมการคุมกฎและใช้กำลังจัดระเบียบโรงเรียนซึ่งเป็น "อาณาจักร" ที่เขารัก เป็นคนเดียวที่ไม่เคยมองรีบอร์นเป็นเด็กธรรมดา เคยแพ้มุคุโร่ในศึกโกคุโยเพราะโรคซากุระคอรัปชั่นจึงแค้นฝังลึก เป็นผู้พิทักษ์เมฆาของวองโกเล่ ใช้ทอนฟากับเปลวไฟธาตุเมฆา ปกป้องแฟมิลี่จากระยะไกลในแบบของตัวเอง ใครก้าวเข้ามาในอาณาเขตแล้วทำผิดกฎหรือมี "เขี้ยวเล็บ" น่าสนใจ ต้องเจอทอนฟา] ตัวละครสนับสนุน [คุซาคาเบะ เท็ตสึยะ: มือขวาผู้จงรักภักดี ใจเย็น เข้าใจฮิบาริโดยไม่ต้องเอ่ยปาก / ดีโน่: ครูสอนพิเศษที่ฮิบาริยอมรับฝีมือ ร่าเริง ซุ่มซ่ามถ้าไม่มีลูกน้อง / รีบอร์น: นักฆ่าที่ฮิบาริเคารพและอยากสู้ด้วย / โรคุโด มุคุโร่: คู่ปรับที่ฮิบาริอยากขย้ำที่สุด / ฮิเบิร์ด: นกสีเหลืองที่ร้องเพลงโรงเรียนนามิโมริได้]`
        };

        const S = JSON.parse(localStorage.getItem('rp_settings_or') || '{}');
        const cfg = {
            base: S.base || 'https://openrouter.ai/api/v1',
            model: S.model || 'inclusionai/ling-3.0-flash-sante:free',
            key: S.key || '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',
            temp: S.temp ?? 0.9
        };
        const saveCfg = () => localStorage.setItem('rp_settings_or', JSON.stringify(cfg));

        const modelSelect = document.getElementById('model-select');
        function buildModels() {
            const list = ['inclusionai/ling-3.0-flash-sante:free', 'openrouter/free'];
            if (!list.includes(cfg.model)) list.push(cfg.model);
            modelSelect.innerHTML = list.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')
                + '<option value="__custom__">+ ใส่ชื่อโมเดลเอง…</option>';
            modelSelect.value = cfg.model;
        }
        modelSelect.onchange = () => {
            if (modelSelect.value === '__custom__') {
                const m = (prompt('ใส่ชื่อโมเดลจาก openrouter.ai/models เช่น xxx/yyy:free') || '').trim();
                if (m) cfg.model = m;
            } else cfg.model = modelSelect.value;
            saveCfg(); buildModels();
        };

        function openSettings() {
            document.getElementById('cfg-base').value = cfg.base;
            document.getElementById('cfg-key').value = cfg.key;
            document.getElementById('settings-modal').classList.add('open');
        }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
        function saveSettings() {
            cfg.base = document.getElementById('cfg-base').value.trim() || 'https://openrouter.ai/api/v1';
            cfg.key = document.getElementById('cfg-key').value.trim();
            saveCfg(); closeSettings();
        }

        /* ---------- ประวัติแชท (Cloud Sync) ---------- */
        let chatHistory = []; 
        let sessionId = localStorage.getItem('kv_session_id');
        if (!sessionId) {
            sessionId = 'user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('kv_session_id', sessionId);
        }
        document.getElementById('session-badge').innerText = 'ID: ' + sessionId;

        const chatWindow = document.getElementById('chat-window');
        const roleField = document.getElementById('system-role');
        roleField.value = localStorage.getItem('rp_role_text') || presetRoles.custom;
        roleField.addEventListener('input', () => localStorage.setItem('rp_role_text', roleField.value));

        const saveHist = async () => {
            try {
                await fetch('/api/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, history: chatHistory })
                });
            } catch (e) {
                console.error("เซฟคลาวด์ขัดข้อง", e);
            }
        };

        const fmt = t => escapeHtml(t).replace(/\n/g, '<br>');
        function bubble(isUser, html, extraStyle = '') {
            const row = document.createElement('div');
            row.className = 'msg-row ' + (isUser ? 'user-row' : 'ai-row');
            row.innerHTML = `<div class="msg-bubble" style="${extraStyle}">${html}</div>`;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return row;
        }

        async function loadCloudHistory() {
            chatWindow.innerHTML = '<div class="msg-row ai-row"><div class="msg-bubble" style="color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> กำลังซิงค์ข้อมูลจาก Cloud...</div></div>';
            try {
                const res = await fetch(`/api/history?sessionId=${sessionId}`);
                const data = await res.json();
                chatHistory = data.history || [];
                
                chatWindow.innerHTML = '';
                chatHistory.forEach(m => bubble(m.role === 'user', fmt(m.content)));
            } catch (e) {
                chatWindow.innerHTML = '<div class="msg-row ai-row"><div class="msg-bubble" style="color: #ef4444;">เชื่อมต่อ Cloud ไม่สำเร็จ (หรือคุณอาจยังไม่ได้อัปโหลดไฟล์ /api/history.js)</div></div>';
            }
        }

        async function selectRole(roleKey, element) {
            document.querySelectorAll('.role-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            roleField.value = presetRoles[roleKey] || '';
            localStorage.setItem('rp_role_text', roleField.value);
            await clearChat(true);
        }

        async function clearChat(skipConfirm = false) {
            if (!skipConfirm && !confirm('คุณต้องการลบประวัติการแชทนี้และเริ่มหัวข้อใหม่ใช่หรือไม่?')) return;
            chatHistory = []; 
            chatWindow.innerHTML = '';
            
            try {
                await fetch(`/api/history?sessionId=${sessionId}`, { method: 'DELETE' });
            } catch (e) {}
        }

        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') { event.preventDefault(); sendMessage(); }
        });

        let busy = false;
        async function sendMessage() {
            if (busy) return;
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;
            const systemRole = roleField.value.trim();

            chatHistory.push({ role: 'user', content: message }); 
            saveHist();
            bubble(true, fmt(message));
            inputField.value = '';

            busy = true; document.getElementById('send-btn').disabled = true;
            const row = bubble(false, '<i class="fa-solid fa-circle-notch fa-spin"></i> ...', 'color: var(--text-muted);');
            const box = row.querySelector('.msg-bubble');
            let out = '';

            try {
                const url = cfg.base.trim().replace(/\/+$/, '').replace(/\/chat\/completions$/, '') + '/chat/completions';
                const messages = [];
                if (systemRole) messages.push({ role: 'system', content: systemRole + '\n\nสวมบทบาทตามข้อมูลนี้ตลอด ห้ามหลุดบท ตอบเป็นภาษาเดียวกับผู้ใช้ และห้ามพูดหรือตัดสินใจแทนผู้ใช้' });
                messages.push(...chatHistory.slice(-40));

                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
                    body: JSON.stringify({ model: cfg.model, stream: true, temperature: cfg.temp, messages })
                });
                if (!r.ok) throw new Error(`API ${r.status} (${url}, model: ${cfg.model}): ${(await r.text()).slice(0, 200)}`);

                const rd = r.body.getReader(), dec = new TextDecoder();
                let buf = '';
                for (;;) {
                    const { done, value } = await rd.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n'); buf = lines.pop();
                    for (const l of lines) {
                        if (!l.startsWith('data:')) continue;
                        const j = l.slice(5).trim();
                        if (j === '[DONE]') continue;
                        try {
                            const c = JSON.parse(j).choices?.[0]?.delta?.content;
                            if (c) {
                                out += c; box.removeAttribute('style'); box.innerHTML = fmt(out);
                                chatWindow.scrollTop = chatWindow.scrollHeight;
                            }
                        } catch {}
                    }
                }
                if (!out) throw new Error('ไม่ได้รับข้อความตอบกลับ');
                chatHistory.push({ role: 'assistant', content: out }); 
                saveHist();
            } catch (error) {
                row.remove();
                bubble(false, 'เชื่อมต่อไม่สำเร็จ: ' + escapeHtml(error.message) + '<br><small>ตรวจ API key ที่ปุ่มฟันเฟือง หรือชื่อโมเดล</small>', 'color:#ef4444; border: 1px solid #ef4444;');
            }
            busy = false; document.getElementById('send-btn').disabled = false;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        buildModels();
        loadCloudHistory();
    </script>
</body>
</html>
