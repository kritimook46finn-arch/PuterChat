<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puter Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#f2f4f9;--panel:#fff;--ink:#1a2233;--mute:#667089;--line:#dde2ee;--acc:#2b45e8;--acc-ink:#fff;--user:#e4e9fd;--code:#eef1f8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--panel:#171e2e;--ink:#e7ebf5;--mute:#8d97b0;--line:#283149;--acc:#7b8dff;--acc-ink:#0f1420;--user:#222c4a;--code:#0f1420}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 "Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
aside h1{font:500 22px "Newsreader",Georgia,serif;margin:18px 16px 12px}
.new{margin:0 12px 10px;padding:9px;border-radius:8px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:600}
#list{flex:1;overflow-y:auto;padding:0 8px}
.chat{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 10px}
.chat:hover,.chat.on{background:var(--bg)}
.chat button.t{flex:1;text-align:left;background:none;border:0;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chat button.x{background:none;border:0;color:var(--mute);padding:4px 8px;border-radius:6px}
.chat button.x:hover{color:var(--ink)}
aside footer{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
aside footer a{color:var(--mute)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header label{color:var(--mute);font-size:13px}
#model{flex:1;max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#msgs{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.m{max-width:100%}
.m.user{align-self:flex-end;background:var(--user);padding:9px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;max-width:85%}
.m.ai{padding:0 2px}
.m.err{color:#c62d4c}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:13px}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:5px 9px}
.md a{color:var(--acc)}
.tools{margin-top:4px}
.tools button{background:none;border:0;color:var(--mute);font-size:13px;padding:2px 6px 2px 0}
.tools button:hover{color:var(--ink)}
.empty{margin:14vh auto 0;text-align:center;color:var(--mute);max-width:420px}
.empty h2{font:500 28px "Newsreader",Georgia,serif;color:var(--ink);margin:0 0 6px}
form{padding:12px 16px 8px;background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
textarea{flex:1;border:0;background:none;resize:none;max-height:180px;padding:6px 8px;outline:none}
#send{border:0;border-radius:9px;background:var(--acc);color:var(--acc-ink);padding:8px 16px;font-weight:600}
.note{max-width:760px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--mute)}
.caret::after{content:"";display:inline-block;width:7px;height:1em;background:var(--acc);margin-left:2px;vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.caret::after{animation:none}}
@media(max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none;box-shadow:0 0 40px #0006}
 #menu{display:block}
}
</style>
</head>
<body>
<aside id="side">
  <h1>Puter Chat</h1>
  <button class="new" id="new">New chat</button>
  <div id="list" aria-label="Conversations"></div>
  <footer>Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener">Puter</a></footer>
</aside>
<main>
  <header>
    <button id="menu" aria-label="Open conversations">Chats</button>
    <label for="model">Model</label>
    <input id="model" list="models" value="gpt-5-nano" spellcheck="false" autocomplete="off">
    <datalist id="models"></datalist>
  </header>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <form id="form">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message the model" aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
    <div class="note">Enter to send, Shift+Enter for a new line. First message asks you to sign in to Puter.</div>
  </form>
</main>

<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), msgs = $('msgs'), input = $('input'), sendBtn = $('send');
let chats = [], cur = null, busy = false, stopFlag = false;

const uid = () => Math.random().toString(36).slice(2, 10);
const md = t => DOMPurify.sanitize(marked.parse(t || ''), {ADD_ATTR: ['target']});

// ---------- persistence (Puter KV, falls back to memory) ----------
async function load() {
  try { chats = JSON.parse((await puter.kv.get('chats')) || '[]'); } catch { chats = []; }
  const last = await puter.kv.get('model').catch(() => null);
  if (last) $('model').value = last;
}
async function save() {
  try { await puter.kv.set('chats', JSON.stringify(chats.slice(0, 60))); } catch (e) { console.warn(e); }
}

// ---------- rendering ----------
function renderList() {
  const el = $('list'); el.innerHTML = '';
  chats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat' + (c.id === cur?.id ? ' on' : '');
    const t = document.createElement('button'); t.className = 't'; t.textContent = c.title;
    t.onclick = () => { open(c.id); $('side').classList.remove('open'); };
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
    x.setAttribute('aria-label', 'Delete chat'); x.onclick = () => del(c.id);
    row.append(t, x); el.append(row);
  });
}
function bubble(m) {
  const d = document.createElement('div');
  if (m.role === 'user') { d.className = 'm user'; d.textContent = m.content; }
  else {
    d.className = 'm ai';
    d.innerHTML = '<div class="md"></div><div class="tools"></div>';
    setAI(d, m.content);
  }
  wrap.append(d); return d;
}
function setAI(d, text, live) {
  const b = d.querySelector('.md');
  b.innerHTML = md(text);
  b.classList.toggle('caret', !!live);
  b.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  if (!live) {
    const tools = d.querySelector('.tools');
    tools.innerHTML = '<button type="button">Copy</button>';
    tools.firstChild.onclick = e => { navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1200); };
  }
}
function renderChat() {
  wrap.innerHTML = '';
  if (!cur || !cur.messages.length) {
    wrap.innerHTML = '<div class="empty"><h2>Ask anything</h2><p>Pick any of 500+ models above. Your chats are stored in your own Puter account.</p></div>';
  } else cur.messages.forEach(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  renderList();
}
function open(id) { cur = chats.find(c => c.id === id); renderChat(); }
function newChat() { cur = {id: uid(), title: 'New chat', messages: []}; renderChat(); input.focus(); }
async function del(id) {
  chats = chats.filter(c => c.id !== id);
  if (cur?.id === id) cur = null;
  await save(); cur ? renderChat() : newChat(); renderList();
}

// ---------- sending ----------
async function send(text) {
  if (!cur) newChat();
  if (!chats.includes(cur)) chats.unshift(cur);
  cur.messages.push({role: 'user', content: text});
  if (cur.title === 'New chat') cur.title = text.slice(0, 40);
  renderChat();
  const ai = bubble({role: 'assistant', content: ''});
  busy = true; stopFlag = false; sendBtn.textContent = 'Stop';
  let out = '';
  try {
    const model = $('model').value.trim() || 'gpt-5-nano';
    const resp = await puter.ai.chat(
      [{role: 'system', content: 'You are a helpful assistant. Answer in Markdown.'}, ...cur.messages.map(({role, content}) => ({role, content}))],
      {model, stream: true}
    );
    for await (const part of resp) {
      if (stopFlag) break;
      if (part?.type === 'error') throw new Error(part.message || 'Model error');
      if (part?.text && (!part.type || part.type === 'text')) {
        out += part.text; setAI(ai, out, true);
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
    cur.messages.push({role: 'assistant', content: out || '(no response)'});
    setAI(ai, out || '(no response)');
    puter.kv.set('model', model).catch(() => {});
  } catch (e) {
    const msg = e?.error?.message || e?.message || (typeof e === 'string' ? e : 'Request failed. Check the model name and try again.');
    if (out) { cur.messages.push({role: 'assistant', content: out}); setAI(ai, out); }
    else ai.remove();
    const err = document.createElement('div'); err.className = 'm ai err'; err.textContent = msg; wrap.append(err);
  }
  busy = false; sendBtn.textContent = 'Send';
  await save(); renderList();
}

// ---------- events ----------
$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { stopFlag = true; return; }
  const t = input.value.trim(); if (!t) return;
  input.value = ''; input.style.height = 'auto'; send(t);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
$('new').onclick = () => { newChat(); $('side').classList.remove('open'); };
$('menu').onclick = () => $('side').classList.toggle('open');

// ---------- init ----------
const presets = ['gpt-5-nano', 'gpt-5.6-luna', 'claude-sonnet-4-6', 'gemini-3.1-flash-lite'];
$('models').innerHTML = presets.map(m => `<option value="${m}">`).join('');
(async () => {
  await load(); newChat();
  try {
    const list = await puter.ai.listModels();
    const ids = list.map(m => typeof m === 'string' ? m : m.id).filter(Boolean);
    if (ids.length) $('models').innerHTML = ids.map(m => `<option value="${m}">`).join('');
  } catch {}
})();
</script>
</body>
</html>
