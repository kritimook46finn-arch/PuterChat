<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roleplay Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#2a344b;--ink:#dfe6f3;--dim:#8b97b0;--ai:#5fb3a1;--me:#d98aa5;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif;display:flex}
aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
h1{font:600 20px "Noto Serif Thai",serif;margin:0 0 4px}
label{font-size:13px;color:var(--dim);display:block;margin-top:4px}
input,textarea,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
textarea{resize:vertical}
button{cursor:pointer;width:auto;background:var(--panel)}
button:hover{border-color:var(--ai)}
button.primary{background:var(--ai);color:#0b1a17;border-color:var(--ai);font-weight:600}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font:600 18px "Noto Serif Thai",serif}
#log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(720px,88%);padding:10px 14px;border-radius:var(--r);white-space:pre-wrap;word-break:break-word}
.m.ai{align-self:flex-start;background:var(--panel);border-left:3px solid var(--ai);font-family:"Noto Serif Thai",serif;line-height:1.8}
.m.me{align-self:flex-end;background:#2a1f2b;border-right:3px solid var(--me)}
.m em{color:var(--dim);font-style:italic}
.m .who{display:block;font-size:12px;color:var(--ai);margin-bottom:2px;font-family:"Noto Sans Thai",sans-serif}
.err{align-self:center;color:#ff9b9b;font-size:14px;max-width:90%}
form{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
form textarea{resize:none;height:52px}
.empty{margin:auto;color:var(--dim);text-align:center;max-width:380px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;max-height:44vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>ตั้งค่าเรื่อง</h1>
  <label for="preset">ตัวละครสำเร็จรูป</label>
  <select id="preset"></select>
  <label for="name">ชื่อตัวละคร</label>
  <input id="name">
  <label for="persona">บุคลิก / ฉาก / กติกา (system prompt)</label>
  <textarea id="persona" rows="8"></textarea>
  <label for="greet">ประโยคเปิดฉาก</label>
  <textarea id="greet" rows="3"></textarea>
  <div class="row"><button class="primary" id="start">เริ่มฉากใหม่</button></div>
  <details>
    <summary style="color:var(--dim);cursor:pointer;margin-top:8px">การเชื่อมต่อ API</summary>
    <label for="base">Base URL</label><input id="base">
    <label for="model">Model</label><input id="model">
    <label for="key">API key</label><input id="key" type="password" autocomplete="off">
    <label for="temp">Temperature</label><input id="temp" type="number" step="0.1" min="0" max="2">
  </details>
</aside>
<main>
  <header><b id="title"></b><div class="row"><button id="regen">สร้างคำตอบใหม่</button><button id="undo">ลบข้อความล่าสุด</button></div></header>
  <div id="log"></div>
  <form id="f">
    <textarea id="input" placeholder="พิมพ์บทของคุณ ใช้ *ดอกจัน* สำหรับการกระทำ เช่น *ยิ้มเบา ๆ*" required></textarea>
    <button class="primary" id="send">ส่ง</button>
  </form>
</main>
<script>
const PRESETS=[
{n:"ไอริน — นักเวทย์ผู้เย็นชา",p:"คุณคือไอริน นักเวทย์หญิงแห่งหอคอยน้ำแข็ง พูดน้อย เย็นชา แต่แอบใจดี ผู้ใช้เป็นนักเดินทางที่มาขอความช่วยเหลือ",g:"*ไอรินเงยหน้าจากหนังสือเวทมนตร์เล่มหนา* \"เจ้าเดินผ่านพายุมาถึงที่นี่ทำไม\""},
{n:"ทีมสืบสวน — นักสืบยุคนัวร์",p:"คุณคือนักสืบเอกชนในเมืองฝนตกยุค 1940 พูดกระชับ ประชดเล็กน้อย ผู้ใช้เป็นลูกความที่นำคดีลึกลับมาให้",g:"*ควันบุหรี่ลอยผ่านแสงไฟ* \"นั่งสิ แล้วเล่าให้ฟังว่าใครทำให้คุณนอนไม่หลับ\""},
{n:"คาเฟ่เพื่อนสนิท — สบาย ๆ",p:"คุณคือเพื่อนสนิทวัยเดียวกับผู้ใช้ เจ้าของคาเฟ่เล็ก ๆ พูดเป็นกันเอง ขี้เล่น ใส่ใจ ตอบสั้นแบบคุยแชต",g:"*วางกาแฟแก้วโปรดตรงหน้า* \"วันนี้เป็นไงบ้าง หน้าตาเหมือนมีเรื่องจะเล่า\""}];
const $=id=>document.getElementById(id);
const S=JSON.parse(localStorage.getItem("rp_settings")||"{}");
const cfg={base:S.base||"https://api.freetheai.org/v1",model:S.model||"fta/bbl/gpt-5.4-mini",key:S.key||"ftai_4d3abc98a220f36e00d5a7c690228f31e8a8cfc8c541521f",temp:S.temp??0.9};
let hist=JSON.parse(localStorage.getItem("rp_hist")||"[]"), busy=false;
PRESETS.forEach((x,i)=>$("preset").add(new Option(x.n,i)));
function loadPreset(i){const x=PRESETS[i];$("name").value=x.n.split(" — ")[0];$("persona").value=x.p;$("greet").value=x.g}
const saved=JSON.parse(localStorage.getItem("rp_char")||"null");
if(saved){$("name").value=saved.name;$("persona").value=saved.persona;$("greet").value=saved.greet}else loadPreset(0);
["base","model","key","temp"].forEach(k=>{$(k).value=cfg[k];$(k).onchange=()=>{cfg[k]=k==="temp"?+$(k).value:$(k).value.trim();localStorage.setItem("rp_settings",JSON.stringify(cfg))}});
$("preset").onchange=e=>loadPreset(e.target.value);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,"<em>*$1*</em>");
function add(role,text){const d=document.createElement("div");d.className="m "+(role==="assistant"?"ai":"me");
  d.innerHTML=(role==="assistant"?`<span class="who">${esc($("name").value)}</span>`:"")+`<span class="t">${fmt(text)}</span>`;
  $("log").append(d);$("log").scrollTop=1e9;return d.querySelector(".t")}
function render(){$("log").innerHTML="";$("title").textContent=$("name").value||"Roleplay";
  if(!hist.length){$("log").innerHTML='<div class="empty">กด "เริ่มฉากใหม่" ทางซ้ายเพื่อเปิดเรื่อง หรือพิมพ์ข้อความแรกได้เลย</div>';return}
  hist.forEach(m=>add(m.role,m.content))}
const save=()=>localStorage.setItem("rp_hist",JSON.stringify(hist));
function sys(){return `${$("persona").value}\n\nกติกา: สวมบทบาทเป็น "${$("name").value}" ตลอด ห้ามหลุดบท เขียนการกระทำในเครื่องหมาย *...* และบทพูดในเครื่องหมายคำพูด ตอบเป็นภาษาเดียวกับผู้ใช้ ห้ามพูดหรือตัดสินใจแทนตัวละครของผู้ใช้`}
function err(msg){const d=document.createElement("div");d.className="err";d.textContent=msg;$("log").append(d);$("log").scrollTop=1e9}
async function reply(){
  busy=true;$("send").disabled=true;$("regen").disabled=true;
  const t=add("assistant","…");let out="";
  try{
    const r=await fetch(cfg.base.replace(/\/$/,"")+"/chat/completions",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model,stream:true,temperature:cfg.temp,messages:[{role:"system",content:sys()},...hist.slice(-40)]})});
    if(!r.ok)throw new Error(`API ${r.status}: ${(await r.text()).slice(0,200)}`);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const l of lines){if(!l.startsWith("data:"))continue;const j=l.slice(5).trim();if(j==="[DONE]")continue;
        try{const c=JSON.parse(j).choices?.[0]?.delta?.content;if(c){out+=c;t.innerHTML=fmt(out);$("log").scrollTop=1e9}}catch{}}}
    if(!out)throw new Error("ไม่ได้รับข้อความตอบกลับ");
    hist.push({role:"assistant",content:out});save();
  }catch(e){t.closest(".m").remove();err("เชื่อมต่อไม่สำเร็จ: "+e.message+" — ตรวจ API key, ชื่อ model หรือเปิดไฟล์นี้ผ่านเบราว์เซอร์ตามปกติ")}
  busy=false;$("send").disabled=false;$("regen").disabled=false;
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("input").value.trim();if(!v||busy)return;
  if(!hist.length)$("log").innerHTML="";
  hist.push({role:"user",content:v});save();add("user",v);$("input").value="";reply()};
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}};
$("start").onclick=()=>{localStorage.setItem("rp_char",JSON.stringify({name:$("name").value,persona:$("persona").value,greet:$("greet").value}));
  hist=$("greet").value?[{role:"assistant",content:$("greet").value}]:[];save();render()};
$("regen").onclick=()=>{if(busy||!hist.length)return;if(hist.at(-1).role==="assistant")hist.pop();
  if(!hist.length||hist.at(-1).role!=="user"){render();return}save();render();reply()};
$("undo").onclick=()=>{if(busy)return;hist.pop();save();render()};
render();
</script>
</body>
</html>
